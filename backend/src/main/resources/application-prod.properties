# Configuration de la datasource (valeurs injectées via variables d'environnement, voir .env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.generate_statistics=false

# Environments that existed before Flyway (schema already created by the old ddl-auto=update,
# e.g. the current Neon dev database) have no flyway_schema_history table yet. baseline-on-migrate
# makes Flyway record V1 as already applied instead of trying to re-run its CREATE TABLEs against
# tables that already exist. A genuinely empty database (fresh Testcontainers/local Postgres) is
# unaffected and just runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Pool de connexions HikariCP (defaut = 10 connexions, trop pour 1 Go) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000


# --- Tomcat (defaut = 200 threads, gourmand en RAM) ---
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100

#jwt parameters (secret injected via .env, see .env.example — never commit a real value here)
jwt.secret=${JWT_SECRET}

jwt.expiration=3600000

#dns frontend
url.front=${URL_FRONT}

# --- Swagger / OpenAPI desactive en prod ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Logs ---
logging.level.root=WARN
logging.level.org.springframework=WARN

# configuration des cookies
app.auth.cookie.secure=true  
app.auth.cookie.same-site=None

# Pas de stack traces / détails d'erreur exposés au client
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Désactiver l'en-tête qui révèle la techno/version (limite le fingerprinting)
server.tomcat.additional-tld-skip-patterns=*.jar
