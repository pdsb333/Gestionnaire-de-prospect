# Configuration de la datasource (valeurs par défaut = dev local, overridables via variables d'environnement)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nom_de_la_base}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:utilisateur}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:motdepasse}

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.generate_statistics=false

# jwt parameters (valeur par défaut = secret dev bidon, jamais utilisé en prod, overridable via env)
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-prod-CHANGE-ME}
jwt.expiration=3600000

# dns frontend
url.front=${URL_FRONT:http://localhost:3000}

# --- Swagger / OpenAPI actif en dev ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- Logs ---
logging.level.root=INFO
logging.level.com.tonpackage=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# configuration des cookies
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax